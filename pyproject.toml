[project]
name = "veripy-agent"
version = "0.1.0"
description = "Contract-driven verifiable agent training and evaluation toolkit"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic>=2.7,<3", "pyyaml>=6.0,<7", "pandas>=2.2,<3"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["ruff>=0.6,<1", "mypy>=1.11,<2", "pytest>=8,<9", "hypothesis>=6.110,<7", "types-PyYAML>=6.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B017"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
